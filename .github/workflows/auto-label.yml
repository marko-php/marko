name: Auto Label PR

on:
  pull_request_target:
    types: [opened, edited]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs the base branch's workflow; check out the base branch (never the
      # PR head) so the detector script below is the reviewed copy, not one a PR could modify.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Apply labels based on conventional commit prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          # Mutually exclusive type labels — remove all before adding the new one
          TYPE_LABELS="bug enhancement documentation refactor testing ci maintenance"

          # Extract the type prefix from the PR title (case-insensitive)
          # Matches: type:, type(scope):, type!:, type(scope)!:
          TYPE=$(echo "$PR_TITLE" | grep -ioP '^[a-z]+(?=(\([^)]*\))?!?:)' || true)

          if [ -z "$TYPE" ]; then
            echo "::error title=PR title is not a conventional commit::Use '<type>[(<scope>)][!]: <description>', e.g. 'feat: add redis driver' or 'feat!: change the queue contract'. Types: fix, feat, docs, refactor, test, ci, chore. See CONTRIBUTING.md."
            exit 1
          fi

          if [ -n "$TYPE" ]; then
            TYPE=$(echo "$TYPE" | tr '[:upper:]' '[:lower:]')

            # Remove all stale type labels first
            for label in $TYPE_LABELS; do
              gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$label" 2>/dev/null || true
            done

            # Map type to label
            case "$TYPE" in
              fix)       NEW_LABEL="bug" ;;
              feat)      NEW_LABEL="enhancement" ;;
              docs)      NEW_LABEL="documentation" ;;
              refactor)  NEW_LABEL="refactor" ;;
              test)      NEW_LABEL="testing" ;;
              ci)        NEW_LABEL="ci" ;;
              chore)     NEW_LABEL="maintenance" ;;
              *)
                echo "::error title=Unknown PR title type '$TYPE'::Use one of: fix, feat, docs, refactor, test, ci, chore. See CONTRIBUTING.md."
                exit 1
                ;;
            esac

            if [ -n "$NEW_LABEL" ]; then
              gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$NEW_LABEL"
            fi
          fi

          # Breaking change: a "!" after the type, or a "BREAKING CHANGE:" footer (Conventional
          # Commits). The label is only ever added here, never removed, so a maintainer can add it
          # by hand to a PR whose title doesn't carry the "!".
          if [ "$(bash .github/scripts/is-breaking-pr.sh)" = true ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "breaking"
          fi
