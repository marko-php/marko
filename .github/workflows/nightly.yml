name: Nightly

# The integration-destructive group deletes vendor/ and composer.lock, runs a full
# `composer update`, and re-runs the suite in a subprocess. That is too slow and too
# stateful for a per-PR gate, but it must not go unrun between releases — bin/release.sh
# is otherwise the first thing to discover a broken install, at the worst moment.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  destructive:
    name: Full suite including destructive integration
    runs-on: ubuntu-latest
    services:
      # Redis integration suites (packages/cache-redis, packages/ratelimiter)
      # skip without a server; this keeps them running on every build.
      redis:
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sockets
          coverage: none
          ini-values: memory_limit=2G

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # Without this, packages/roadrunner's end-to-end suite finds no `rr`
      # binary on this runner and every one of its security-critical
      # isolation assertions silently skips — the exact failure mode
      # tests/CiWorkflowTest.php guards against below.
      - name: Install the RoadRunner binary
        run: vendor/bin/rr get-binary --no-config --no-interaction

      - name: Run full test suite
        run: composer test:all
