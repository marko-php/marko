# Per-project config for the worktree tool (~/Sites/claude-dev-env/worktree).
# Sourced as POSIX sh by bin/worktree; values containing spaces are quoted.
# Marko is a plain project: a worktree is a git checkout plus a cloned vendor/
# and a composer install. No Docker, no ports, no Traefik routes, no .env.
WT_MODE=plain
WT_PROJECT=marko
# Required key, unused in plain mode (nothing is served).
WT_DOMAIN=marko.test
WT_BASE_BRANCH=develop
# Marko branches are always feature/{name}.
WT_BRANCH_PREFIX=feature/
WT_CLONE_DIRS=vendor
# composer.lock is gitignored and clone_dir copies directories only, so copy
# main's lock first; otherwise composer install resolves from scratch.
WT_PROVISION_STEPS="cp ../../../composer.lock composer.lock
composer install --no-interaction"
# Path regexes (whitespace-separated) that never keep a worktree from being reaped.
WT_REAP_DISPOSABLE_EXTRA='\.phpstan-cache \.php-cs-fixer\.cache composer\.lock rr \.rr\.yaml'
